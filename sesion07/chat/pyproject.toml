[project]
name = "chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erick Tucto", email = "erick@ericktucto.com" }
]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.10",
    "fastapi[standard]>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "python-dotenv>=1.2.4",
    "python-socketio>=5.18.1",
    "sqlmodel>=0.0.50",
]

[project.scripts]
chat = "chat:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "chat:app"
