[project]
name = "chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erick Tucto", email = "erick@ericktucto.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.7",
    "python-socketio>=5.18.1",
]

[project.scripts]
chat = "chat:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "chat:app"